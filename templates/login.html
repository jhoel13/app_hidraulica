<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UNC Hidráulica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ============================================
           RESET Y VARIABLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --azul-oscuro: #0a1628;
            --azul-profundo: #132640;
            --azul-medio: #1a3a5c;
            --crema: #f5f0e8;
            --crema-claro: #faf7f0;
            --celeste-hielo: #b8e2f2;
            --celeste-claro: #e6f3fa;
            --dorado: #f0b829;
            --dorado-oscuro: #d4a020;
            --dorado-claro: #fce4a8;
            --texto-oscuro: #1a1a2e;
            --texto-gris: #6b7280;
            --verde: #16a34a;
            --rojo: #dc2626;
            --sombra: 0 20px 60px rgba(0,0,0,0.12);
            --sombra-hover: 0 25px 70px rgba(0,0,0,0.18);
            --borde-redondeado: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--crema);
            overflow: hidden;
        }

        /* ============================================
           BACKGROUND ANIMADO
           ============================================ */
        .bg-animated {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-profundo) 50%, var(--azul-medio) 100%);
            overflow: hidden;
        }

        .bg-animated .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-animated .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--dorado);
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .bg-animated .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: var(--celeste-hielo);
            bottom: -100px;
            left: -100px;
            animation-delay: -7s;
        }

        .bg-animated .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: var(--azul-medio);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }

        /* ============================================
           PARTÍCULAS
           ============================================ */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            animation: particleFloat 25s infinite linear;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* ============================================
           CONTAINER
           ============================================ */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================
           LOGIN CARD
           ============================================ */
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--borde-redondeado);
            padding: 2.5rem;
            box-shadow: var(--sombra);
            border: 1px solid rgba(255,255,255,0.2);
            transition: var(--transition);
        }

        .login-card:hover {
            box-shadow: var(--sombra-hover);
        }

        /* ============================================
           HEADER
           ============================================ */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 1rem;
        }

        .login-header .logo-wrapper .logo-glow {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240,184,41,0.2), transparent 70%);
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .login-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--dorado);
            padding: 6px;
            background: white;
            position: relative;
            z-index: 1;
            object-fit: contain;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--azul-oscuro);
            margin-bottom: 0.2rem;
        }

        .login-header h1 span {
            color: var(--dorado);
        }

        .login-header p {
            color: var(--texto-gris);
            font-size: 0.95rem;
        }

        /* ============================================
           FORM
           ============================================ */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            position: relative;
        }

        .form-group .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-gris);
            opacity: 0.5;
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3rem;
            border: 2px solid #e5e0d8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--crema-claro);
            color: var(--texto-oscuro);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--dorado);
            box-shadow: 0 0 0 4px rgba(240,184,41,0.12);
            background: white;
        }

        .form-group input:focus + .input-icon,
        .form-group input:focus ~ .input-icon {
            color: var(--dorado);
            opacity: 1;
        }

        .form-group input::placeholder {
            color: #b0a8a0;
        }

        .form-group .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--texto-gris);
            opacity: 0.5;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            padding: 0.3rem;
        }

        .form-group .toggle-password:hover {
            opacity: 1;
            color: var(--azul-oscuro);
        }

        /* ============================================
           FORM OPTIONS
           ============================================ */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin: 0.2rem 0;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--texto-gris);
            cursor: pointer;
            transition: var(--transition);
        }

        .form-options label:hover {
            color: var(--azul-oscuro);
        }

        .form-options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--dorado);
            cursor: pointer;
        }

        .form-options a {
            color: var(--dorado);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .form-options a:hover {
            color: var(--dorado-oscuro);
            text-decoration: underline;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            background: var(--azul-oscuro);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--dorado), var(--dorado-oscuro));
            opacity: 0;
            transition: var(--transition);
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(10,22,40,0.25);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           ERROR MESSAGE
           ============================================ */
        .error-message {
            background: var(--rojo);
            color: white;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            animation: shake 0.5s ease;
        }

        .error-message.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .error-message i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f0ebe3;
        }

        .login-footer p {
            color: var(--texto-gris);
            font-size: 0.9rem;
        }

        .login-footer a {
            color: var(--dorado);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--dorado-oscuro);
            text-decoration: underline;
        }

        /* ============================================
           SOCIAL LOGIN (Opcional)
           ============================================ */
        .social-login {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            padding: 0.7rem;
            border: 2px solid #e5e0d8;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.1rem;
            color: var(--texto-gris);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            border-color: var(--dorado);
            background: var(--crema-claro);
            transform: translateY(-2px);
        }

        .social-btn.google { color: #ea4335; }
        .social-btn.google:hover { border-color: #ea4335; background: rgba(234,67,53,0.05); }
        .social-btn.microsoft { color: #00a4ef; }
        .social-btn.microsoft:hover { border-color: #00a4ef; background: rgba(0,164,239,0.05); }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 520px) {
            .login-container {
                padding: 1rem;
            }

            .login-card {
                padding: 1.5rem;
            }

            .login-header img {
                width: 60px;
                height: 60px;
            }

            .login-header h1 {
                font-size: 1.4rem;
            }

            .form-options {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }

            .social-login {
                flex-direction: column;
            }

            .btn-login {
                font-size: 0.95rem;
                padding: 0.8rem;
            }
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transform: translateX(120%);
            opacity: 0;
            transition: var(--transition);
            z-index: 9999;
            max-width: 400px;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            background: var(--verde);
        }

        .toast.error {
            background: var(--rojo);
        }

        .toast.info {
            background: var(--azul-oscuro);
        }
    </style>
</head>
<body>

    <!-- ============================================
    BACKGROUND
    ============================================ -->
    <div class="bg-animated">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="particles" id="particles"></div>

    <!-- ============================================
    LOGIN CONTAINER
    ============================================ -->
    <div class="login-container">
        <div class="login-card">

            <!-- Header -->
            <div class="login-header">
                <div class="logo-wrapper">
                    <div class="logo-glow"></div>
                    <img src="{{ url_for('static', filename='img/logo_unc.png') }}" alt="UNC">
                </div>
                <h1>UNC <span>Hidráulica</span></h1>
                <p>Plataforma Inteligente de Ingeniería Hidráulica</p>
            </div>

            <!-- Error Message -->
            {% if error %}
            <div class="error-message show">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Credenciales incorrectas</span>
            </div>

            <!-- Form -->
            <form class="login-form" method="POST" action="{{ url_for('login') }}" id="loginForm" novalidate>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Correo Electrónico" required autocomplete="email" value="{{ request.form.get('email', '') }}">
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required autocomplete="current-password">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember" {% if request.form.get('remember') %}checked{% endif %}>
                        Recordarme
                    </label>
                    <a href="#" onclick="showToast('📧 Se enviará un enlace a tu correo', 'info')">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-content">
                        <span class="spinner"></span>
                        <span class="btn-text">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </span>
                    </span>
                </button>
            </form>

            <!-- Social Login -->
            <div style="display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem;">
                <div style="flex: 1; height: 1px; background: #e5e0d8;"></div>
                <span style="color: var(--texto-gris); font-size: 0.8rem;">O continuar con</span>
                <div style="flex: 1; height: 1px; background: #e5e0d8;"></div>
            </div>

            <div class="social-login">
                <button class="social-btn google" onclick="showToast('🔐 Google Login pronto disponible', 'info')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn microsoft" onclick="showToast('🔐 Microsoft Login pronto disponible', 'info')">
                    <i class="fab fa-microsoft"></i> Microsoft
                </button>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>
                    ¿No tienes cuenta?
                    <a href="{{ url_for('register') }}">Regístrate aquí</a>
                </p>
                <p style="font-size: 0.75rem; margin-top: 0.5rem; opacity: 0.5;">
                    <i class="fas fa-shield-alt"></i> Tus datos están seguros
                </p>
            </div>
        </div>
    </div>

    <!-- ============================================
    TOAST
    ============================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script>
        // ============================================
        // PARTICLES
        // ============================================
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = (Math.random() * 4 + 2) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 20 + 15) + 's';
                p.style.animationDelay = (Math.random() * 15) + 's';
                container.appendChild(p);
            }
        })();

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================
        // TOGGLE PASSWORD
        // ============================================
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================
        // VALIDACIÓN EN TIEMPO REAL
        // ============================================
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        emailInput.addEventListener('input', function() {
            if (this.value && !this.validity.valid) {
                showError('Por favor ingresa un correo válido');
            } else {
                hideError();
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value && this.value.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres');
            } else {
                hideError();
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        // ============================================
        // SUBMIT FORM
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validación
            if (!email) {
                e.preventDefault();
                showError('Por favor ingresa tu correo electrónico');
                document.getElementById('email').focus();
                return;
            }

            if (!password) {
                e.preventDefault();
                showError('Por favor ingresa tu contraseña');
                document.getElementById('password').focus();
                return;
            }

            if (password.length < 6) {
                e.preventDefault();
                showError('La contraseña debe tener al menos 6 caracteres');
                document.getElementById('password').focus();
                return;
            }

            // Mostrar loading
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            // Si hay error de validación de HTML5, mostrar mensaje
            if (!document.getElementById('email').checkValidity()) {
                e.preventDefault();
                showError('Por favor ingresa un correo electrónico válido');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        // ============================================
        // ENTER KEY (ya manejado por el formulario)
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.tagName === 'INPUT') {
                    // El formulario se enviará automáticamente
                }
            }
        });

        // ============================================
        // DEMO CREDENTIALS (ayuda para testing)
        // ============================================
        console.log('🔐 Credenciales de prueba:');
        console.log('📧 admin@unc.edu.pe');
        console.log('🔑 admin123');
        console.log('📧 demo@unc.edu.pe');
        console.log('🔑 demo123');

        // Mostrar ayuda al hacer doble clic en el logo
        document.querySelector('.login-header .logo-wrapper').addEventListener('dblclick', function() {
            document.getElementById('email').value = 'demo@unc.edu.pe';
            document.getElementById('password').value = 'demo123';
            showToast('✅ Credenciales de prueba cargadas', 'success');
        });

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        console.log('🔐 Login cargado correctamente');
        console.log('💡 Doble clic en el logo para cargar credenciales de prueba');
    </script>
</body>
</html>
